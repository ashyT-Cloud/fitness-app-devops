services:

  backend:
    build:
      context: ./app/backend
    image: fittrack-backend:v1
    container_name: fittrack-backend

    ports:
      - "${BACKEND_PORT}:3000"

    environment:
      PORT: ${BACKEND_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}

    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
    image: fittrack-frontend:v1
    container_name: fittrack-frontend

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      - backend

    restart: unless-stopped

  mongodb:
    image: mongo:8

    container_name: fittrack-mongodb

    ports:
      - "${MONGO_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    restart: unless-stopped

volumes:
  mongodb-data:
