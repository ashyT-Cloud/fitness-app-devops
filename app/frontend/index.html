<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <h1>🏋️ FitTrack</h1>

    <h2>Add Workout</h2>

    <input id="workoutName" placeholder="Workout Name">

    <input id="duration" type="number" placeholder="Duration (min)">

    <input id="calories" type="number" placeholder="Calories Burned">

    <button id="addBtn">Add Workout</button>

    <hr>

    <h2>Workouts</h2>

    <div id="workoutList"></div>
  </div>

<script src="js/app.js"></script>
</body>
</html>
